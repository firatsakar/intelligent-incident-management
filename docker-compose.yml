# The whole platform in one command:
#
#   docker compose up --build
#
# Then open http://localhost:8080 — the console asks for the one-time setup code, which the
# identity service writes to its log:
#
#   docker compose logs identity | grep "First-run setup"
#
# Nothing has to be filled in first. On the first start the `secrets` container generates every
# password and key this installation needs into the `secrets` volume, and everything else reads
# them from there. Optional settings — the Anthropic API key above all — come from the environment
# or from a `.env` file next to this one (see example.env).
#
# One door to the network: the gateway, which serves the console and every API. The admin
# interfaces (Seq, pgAdmin, Kibana) answer on 127.0.0.1 only; Postgres, RabbitMQ and Elasticsearch
# answer inside this network only.
#
# This is not the development setup — that is docker-compose.dev.yml, which runs only the
# infrastructure and leaves the services to `dotnet run`.

name: iim

# What every .NET service shares: its generated secrets, the bus, the logs, migrations on startup.
x-service: &service
  restart: unless-stopped
  depends_on:
    secrets:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    seq:
      condition: service_started
  volumes:
    - secrets:/run/iim:ro
  networks:
    - iim

x-service-environment: &service-environment
  # Jwt__SigningKey, Secrets__EncryptionKey, EventBus__Password and the connection strings, one file
  # each, generated by the `secrets` container.
  IIM_SECRETS_DIR: /run/iim/config
  EventBus__Host: rabbitmq
  EventBus__UserName: iim
  Seq__Url: http://seq
  Database__MigrateOnStartup: "true"

services:

  # --- First start --------------------------------------------------------------------------------

  # Generates the installation's secrets once and exits; a second start changes nothing.
  secrets:
    image: alpine:3.20
    command: ["/bin/sh", "/generate-secrets.sh"]
    restart: "no"
    volumes:
      - ./deploy/generate-secrets.sh:/generate-secrets.sh:ro
      - secrets:/secrets
      - rabbitmq_conf:/rabbitmq-conf
    network_mode: none

  # --- Infrastructure -----------------------------------------------------------------------------

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/iim/raw/postgres-password
      IDENTITY_DB_PASSWORD_FILE: /run/iim/raw/identity-db-password
      INCIDENT_DB_PASSWORD_FILE: /run/iim/raw/incident-db-password
      AGENT_DB_PASSWORD_FILE: /run/iim/raw/agent-db-password
      NOTIFICATION_DB_PASSWORD_FILE: /run/iim/raw/notification-db-password
      TELEMETRY_DB_PASSWORD_FILE: /run/iim/raw/telemetry-db-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - secrets:/run/iim:ro
      # Runs on the first start only: five databases, five owners.
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      # Over TCP: while the first-start script runs, the server listens on its socket only, so this
      # passes once the five databases exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - iim

  rabbitmq:
    image: rabbitmq:3
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # Its user and password, generated with the rest.
      - rabbitmq_conf:/etc/rabbitmq/conf.d:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - iim

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # Reachable from this network only, and a derived view of analyses the incident service
      # already holds — the same trade-off as development.
      - xpack.security.enabled=false
      - cluster.name=iim
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    networks:
      - iim

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    # Seq takes its first admin password from the environment only, so it is read from the
    # generated file here and handed to Seq's own entrypoint. User "admin"; Seq asks for a new
    # password at the first sign-in.
    entrypoint: ["/bin/sh", "-c", "export SEQ_FIRSTRUN_ADMINPASSWORD=\"$$(cat /run/iim/raw/seq-admin-password)\"; exec /bin/seqentry"]
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq_data:/data
      - secrets:/run/iim:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${SEQ_PORT:-8081}:80"
    networks:
      - iim

  # --- Admin interfaces ---------------------------------------------------------------------------

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      # pgAdmin wants something shaped like a real address; it is only the sign-in name.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/iim/raw/pgadmin-password
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - secrets:/run/iim:ro
      # The IIM server already listed; its password is the generated postgres-password.
      - ./deploy/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iim

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.3
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - iim

  # --- IIM ----------------------------------------------------------------------------------------

  identity:
    <<: *service
    image: iim-identity:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        PROJECT: src/Services/IdentityService/IdentityService.API/IdentityService.API.csproj
        ASSEMBLY: IdentityService.API
    environment:
      <<: *service-environment
      # Invitation and password-reset links point here.
      Console__BaseUrl: ${IIM_PUBLIC_URL:-http://localhost:8080}
      Mail__Host: ${SMTP_HOST:-}
      Mail__Port: ${SMTP_PORT:-587}
      Mail__From: ${SMTP_FROM:-}
      Mail__Username: ${SMTP_USERNAME:-}
      Mail__Password: ${SMTP_PASSWORD:-}
      Mail__UseTls: ${SMTP_USE_TLS:-true}

  incident:
    <<: *service
    image: iim-incident:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        PROJECT: src/Services/IncidentService/IncidentService.API/IncidentService.API.csproj
        ASSEMBLY: IncidentService.API
    environment:
      <<: *service-environment

  agent:
    <<: *service
    image: iim-agent:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        PROJECT: src/Services/AgentOrchestrator/AgentOrchestrator.API/AgentOrchestrator.API.csproj
        ASSEMBLY: AgentOrchestrator.API
    depends_on:
      secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      <<: *service-environment
      Elasticsearch__Uri: http://elasticsearch:9200
      # Without it every analysis is recorded as failed; everything else works.
      AiAnalyzer__ApiKey: ${ANTHROPIC_API_KEY:-}

  notification:
    <<: *service
    image: iim-notification:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        PROJECT: src/Services/NotificationService/NotificationService.API/NotificationService.API.csproj
        ASSEMBLY: NotificationService.API
    environment:
      <<: *service-environment

  telemetry:
    <<: *service
    image: iim-telemetry:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        PROJECT: src/Services/TelemetryIngestionService/TelemetryIngestionService.API/TelemetryIngestionService.API.csproj
        ASSEMBLY: TelemetryIngestionService.API
    environment:
      <<: *service-environment
      Telemetry__LogRetentionDays: ${LOG_RETENTION_DAYS:-7}

  gateway:
    image: iim-gateway:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    environment:
      Seq__Url: http://seq
      Services__Identity: http://identity:8080
      Services__Incident: http://incident:8080
      Services__Agent: http://agent:8080
      Services__Notification: http://notification:8080
      Services__Telemetry: http://telemetry:8080
      ForwardedHeaders__KnownProxies: ${FORWARDED_KNOWN_PROXIES:-}
    ports:
      # The only port open to the network: the console, the API and OTLP log ingest.
      - "${IIM_PORT:-8080}:8080"
    depends_on:
      - identity
      - incident
      - agent
      - notification
      - telemetry
    networks:
      - iim

networks:
  iim:

volumes:
  # The installation's generated passwords and keys. Removing it means new keys: everybody is
  # signed out and stored customer credentials can no longer be decrypted.
  secrets:
  rabbitmq_conf:
  postgres_data:
  rabbitmq_data:
  elasticsearch_data:
  seq_data:
  pgadmin_data:
